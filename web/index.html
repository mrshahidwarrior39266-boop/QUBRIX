  <!-- APPLICATION LOGIC -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- ZERO-DEPENDENCY PROCEDURAL WEB AUDIO ENGINE ---
    class CyberAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, duration = 0.1, type = 'sine', volume = 0.1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      click() { this.playTone(880, 0.04, 'triangle', 0.05); }
      tab() {
        this.playTone(440, 0.06, 'sine', 0.08);
        setTimeout(() => this.playTone(659.25, 0.08, 'sine', 0.06), 35);
      }
      slider() { this.playTone(330, 0.03, 'sine', 0.04); }
      regradeSuccess() {
        const chord = [392.00, 523.25, 659.25, 783.99];
        chord.forEach((f, i) => setTimeout(() => this.playTone(f, 0.18, 'sine', 0.08), i * 40));
      }
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }
    }
    const sound = new CyberAudioEngine();

    // --- 3D THREE.JS WEBGL HERO COMPONENT ---
    function ThreeHeroCanvas({ activeCriterion, criteriaCount, currentScore }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        sceneRef.current = scene;
        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.set(0, 2, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x270c12, 1.2);
        scene.add(ambientLight);

        const crimsonLight = new THREE.PointLight(0xDC143C, 35, 60);
        crimsonLight.position.set(10, 8, 8);
        scene.add(crimsonLight);

        const goldLight = new THREE.PointLight(0xF5D77F, 25, 50);
        goldLight.position.set(-10, -6, 6);
        scene.add(goldLight);

        // Rotating Wireframe Icosahedron (Centerpiece)
        const icoGeo = new THREE.IcosahedronGeometry(4.2, 1);
        const icoMat = new THREE.MeshStandardMaterial({
          color: 0xDC143C,
          wireframe: true,
          transparent: true,
          opacity: 0.35,
          emissive: 0x520712,
        });
        const icosahedron = new THREE.Mesh(icoGeo, icoMat);
        icosahedron.position.set(0, 0, 0);
        scene.add(icosahedron);

        // Inner glowing core (Champagne Gold)
        const coreGeo = new THREE.SphereGeometry(1.6, 16, 16);
        const coreMat = new THREE.MeshStandardMaterial({
          color: 0xF5D77F,
          roughness: 0.2,
          metalness: 0.8,
          emissive: 0xF5D77F,
          emissiveIntensity: 0.4,
        });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        scene.add(coreMesh);

        // Orbiting Torus Rings
        const ringGeo = new THREE.TorusGeometry(6.5, 0.08, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xDC143C, transparent: true, opacity: 0.4 });
        const ring1 = new THREE.Mesh(ringGeo, ringMat);
        ring1.rotation.x = Math.PI / 3;
        scene.add(ring1);

        const ring2 = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xF5D77F, transparent: true, opacity: 0.3 }));
        ring2.rotation.y = Math.PI / 4;
        scene.add(ring2);

        // Particle Galaxy (1,000 dust particles in Champagne & Crimson)
        const partCount = 1000;
        const partGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(partCount * 3);
        const colors = new Float32Array(partCount * 3);

        const cCrimson = new THREE.Color(0xDC143C);
        const cGold = new THREE.Color(0xF5D77F);

        for (let i = 0; i < partCount; i++) {
          const r = 12 + Math.random() * 20;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = (Math.random() - 0.5) * 16;
          positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

          const chosenColor = Math.random() > 0.4 ? cCrimson : cGold;
          colors[i * 3] = chosenColor.r;
          colors[i * 3 + 1] = chosenColor.g;
          colors[i * 3 + 2] = chosenColor.b;
        }

        partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        partGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const partMat = new THREE.PointsMaterial({
          size: 0.18,
          vertexColors: true,
          transparent: true,
          opacity: 0.75,
        });
        const particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        // Mouse Parallax
        let mouseX = 0, mouseY = 0;
        const handleMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', handleMouseMove);

        // Animation Loop
        let animId;
        const clock = new THREE.Clock();

        const animate = () => {
          animId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          icosahedron.rotation.x = t * 0.18;
          icosahedron.rotation.y = t * 0.25;

          coreMesh.position.y = Math.sin(t * 1.5) * 0.4;
          ring1.rotation.z = t * 0.12;
          ring2.rotation.x = t * 0.09;

          particles.rotation.y = t * 0.04;
          particles.rotation.x = t * 0.02;

          // Gentle camera drift toward mouse
          camera.position.x += (mouseX * 3 - camera.position.x) * 0.03;
          camera.position.y += (-mouseY * 2 + 2 - camera.position.y) * 0.03;
          camera.lookAt(0, 0, 0);

          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, []);

      return (
        <div className="relative w-full h-[360px] md:h-[440px] overflow-hidden rounded-2xl border border-crimson-800/40 bg-blackred-950/70 shadow-panel backdrop-blur-md">
          <div ref={mountRef} className="absolute inset-0 cursor-crosshair"></div>
          
          {/* Overlay HUD Badges */}
          <div className="absolute top-4 left-4 z-10 flex items-center space-x-3 pointer-events-none">
            <span className="flex h-2.5 w-2.5 relative">
              <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-crimson-400 opacity-75"></span>
              <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-crimson"></span>
            </span>
            <span className="font-mono text-[11px] tracking-widest text-champagne-gold uppercase font-semibold">
              WebGL Neural Evaluation Field Active
            </span>
          </div>

          <div className="absolute top-4 right-4 z-10 font-mono text-[11px] text-slate-400 bg-blackred-900/80 px-3 py-1 rounded-md border border-crimson-800/40">
            FPS: 60 • Three.js r128 • Shaders OK
          </div>

          <div className="absolute bottom-4 left-6 z-10 pointer-events-none max-w-md">
            <h2 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
              <span className="text-champagne-gold">RubricGrader</span>
              <span className="text-crimson-400 font-mono text-sm px-2 py-0.5 rounded bg-crimson-900/40 border border-crimson-700/50">v2.0</span>
            </h2>
            <p className="text-xs text-slate-300 mt-1 leading-relaxed">
              Auditable, sub-10ms short-answer evaluation. Highlighting verbatim student evidence and eliminating black-box bias without answer key leakage.
            </p>
          </div>

          <div className="absolute bottom-4 right-6 z-10 flex items-center gap-2">
            <span className="text-xs font-mono text-slate-400">Interactive 3D Field: Drag cursor to orbit</span>
          </div>
        </div>
      );
    }

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [datasets, setDatasets] = useState([]);
      const [currentDatasetId, setCurrentDatasetId] = useState('biology');
      const [assessment, setAssessment] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const [activeTab, setActiveTab] = useState('students'); // 'students', 'regrade', 'borderline', 'export'
      const [sliderWeights, setSliderWeights] = useState({});
      const [regradeReport, setRegradeReport] = useState(null);
      const [regrading, setRegrading] = useState(false);
      const [soundActive, setSoundActive] = useState(true);

      const [selectedStudent, setSelectedStudent] = useState(null);
      const [uploading, setUploading] = useState(false);

      // Load available datasets
      useEffect(() => {
        fetch('/api/datasets')
          .then(res => res.json())
          .then(data => {
            setDatasets(data.datasets || []);
          })
          .catch(err => {
            console.error('Failed to load datasets:', err);
            setError('Backend connection error. Ensure backend_api.py is running on port 8000.');
          });
      }, []);

      // Load active assessment whenever dataset changes
      useEffect(() => {
        setLoading(true);
        setError(null);
        fetch(`/api/assessment?dataset_id=${encodeURIComponent(currentDatasetId)}`)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(data => {
            setAssessment(data);
            // Initialize slider weights from rubric
            const initialWeights = {};
            (data.rubric || []).forEach(c => {
              initialWeights[c.criterion_id] = parseFloat(c.max_points);
            });
            setSliderWeights(initialWeights);
            setSelectedStudent(data.students && data.students[0] ? data.students[0] : null);
            setLoading(false);
          })
          .catch(err => {
            console.error('Error fetching assessment:', err);
            setError(`Could not load assessment: ${err.message}`);
            setLoading(false);
          });
      }, [currentDatasetId]);

      // Debounced regrading trigger
      const triggerRegrade = (newWeights) => {
        setRegrading(true);
        fetch('/api/regrade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            dataset_id: currentDatasetId,
            slider_weights: newWeights
          })
        })
          .then(res => res.json())
          .then(diffData => {
            setRegradeReport(diffData);
            setRegrading(false);
            sound.regradeSuccess();
          })
          .catch(err => {
            console.error('Regrade error:', err);
            setRegrading(false);
          });
      };

      const handleSliderChange = (cid, val) => {
        sound.slider();
        const updated = { ...sliderWeights, [cid]: parseFloat(val) };
        setSliderWeights(updated);
        triggerRegrade(updated);
      };

      const handleResetWeights = () => {
        sound.click();
        if (!assessment) return;
        const defaultWeights = {};
        (assessment.rubric || []).forEach(c => {
          defaultWeights[c.criterion_id] = parseFloat(c.max_points);
        });
        setSliderWeights(defaultWeights);
        triggerRegrade(defaultWeights);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const formData = new FormData();
        formData.append('file', file);

        fetch('/api/upload', {
          method: 'POST',
          body: formData
        })
          .then(res => res.json())
          .then(data => {
            setUploading(false);
            sound.regradeSuccess();
            // Refresh dataset list
            fetch('/api/datasets')
              .then(r => r.json())
              .then(dsData => {
                setDatasets(dsData.datasets || []);
                const customOpt = dsData.datasets.find(d => d.type === 'custom');
                if (customOpt) {
                  setCurrentDatasetId(customOpt.id);
                }
              });
          })
          .catch(err => {
            setUploading(false);
            alert('Upload failed: ' + err.message);
          });
      };

      // Helper to render student answer with highlighted verbatim quotes
      const renderHighlightedAnswer = (studentAnswer, criteriaEvaluations) => {
        if (!criteriaEvaluations || criteriaEvaluations.length === 0) {
          return <span>{studentAnswer}</span>;
        }

        // Collect all verified quotes
        const quotes = criteriaEvaluations
          .filter(c => c.is_quote_verified && c.evidence_quote && c.evidence_quote.trim().length > 3)
          .map(c => c.evidence_quote.trim());

        if (quotes.length === 0) {
          return <span>{studentAnswer}</span>;
        }

        // Sort quotes by length descending to avoid partial nesting issues
        quotes.sort((a, b) => b.length - a.length);

        let segments = [{ text: studentAnswer, isHighlight: false }];

        quotes.forEach(quote => {
          const nextSegments = [];
          segments.forEach(seg => {
            if (seg.isHighlight) {
              nextSegments.push(seg);
              return;
            }
            const idx = seg.text.toLowerCase().indexOf(quote.toLowerCase());
            if (idx !== -1) {
              const before = seg.text.substring(0, idx);
              const match = seg.text.substring(idx, idx + quote.length);
              const after = seg.text.substring(idx + quote.length);
              if (before) nextSegments.push({ text: before, isHighlight: false });
              nextSegments.push({ text: match, isHighlight: true });
              if (after) nextSegments.push({ text: after, isHighlight: false });
            } else {
              nextSegments.push(seg);
            }
          });
          segments = nextSegments;
        });

        return (
          <span>
            {segments.map((s, i) => 
              s.isHighlight ? (
                <mark key={i} className="evidence-highlight font-medium">
                  {s.text}
                </mark>
              ) : (
                <span key={i}>{s.text}</span>
              )
            )}
          </span>
        );
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 md:px-8 space-y-6">
          
          {/* --- TOP HUD TELEMETRY BAR --- */}
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 rounded-xl border border-crimson-800/40 bg-blackred-900/90 shadow-panel backdrop-blur-md">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-lg bg-gradient-to-br from-crimson to-crimson-900 flex items-center justify-center shadow-crimson-sm border border-crimson-500/50">
                <span className="font-mono font-bold text-champagne text-lg">RG</span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-bold text-lg text-white tracking-tight">RubricGrader AI</h1>
                  <span className="font-mono text-[10px] text-champagne-gold uppercase tracking-widest px-2 py-0.5 rounded bg-crimson-950 border border-crimson-800">
                    Cyber-Studio
                  </span>
                </div>
                <p className="text-xs text-slate-400">Explainable Assessment & Instant Decoupled Regrading</p>
              </div>
            </div>

            {/* Live Telemetry Chips */}
            <div className="flex flex-wrap items-center gap-2 text-xs font-mono">
              <div className="px-2.5 py-1 rounded bg-blackred-800/90 border border-crimson-800/50 flex items-center gap-1.5 text-slate-300">
                <span className="w-2 h-2 rounded-full bg-champagne-gold animate-pulse"></span>
                <span>LATENCY:</span>
                <span className="text-champagne-gold font-bold">
                  {regradeReport ? `${regradeReport.recalculation_latency_ms}ms` : '< 5ms'}
                </span>
              </div>

              <div className="px-2.5 py-1 rounded bg-blackred-800/90 border border-crimson-800/50 flex items-center gap-1.5 text-slate-300">
                <span className="w-2 h-2 rounded-full bg-crimson-400"></span>
                <span>GUARDRAIL:</span>
                <span className="text-crimson-300 font-bold">4-Gram Shield Active</span>
              </div>

              <div className="px-2.5 py-1 rounded bg-blackred-800/90 border border-crimson-800/50 flex items-center gap-1.5 text-slate-300">
                <span>OFFLINE:</span>
                <span className="text-emerald-400 font-bold">100% Zero-Net Safe</span>
              </div>

              {/* Sound Synthesizer Toggle */}
              <button 
                onClick={() => {
                  const s = sound.toggle();
                  setSoundActive(s);
                  sound.click();
                }}
                className={`px-3 py-1 rounded border transition-colors flex items-center gap-1.5 ${
                  soundActive 
                    ? 'bg-crimson-950/80 border-crimson-600 text-champagne-gold shadow-crimson-sm' 
                    : 'bg-blackred-950 border-slate-700 text-slate-500'
                }`}
                title="Toggle Web Audio Procedural Synthesizer"
              >
                <span>{soundActive ? '🔊 SYNTH ON' : '🔇 MUTED'}</span>
              </button>
            </div>
          </header>

          {/* --- 3D THREE.JS WEBGL HERO --- */}

                                <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-crimson-950 text-crimson-300 border border-crimson-800">
                                  Discrepancy: {s.score_discrepancy.toFixed(1)} pts
                                </span>
                              </div>
                              <p className="text-xs text-slate-300 line-clamp-2">{s.student_answer}</p>
                            </div>

                            <div className="flex items-center gap-3 font-mono text-xs">
                              <div>
                                <span className="text-slate-400">AI Score: </span>
                                <span className="font-bold text-champagne-gold">{s.rubric_score}</span>
                              </div>
                              <div>
                                <span className="text-slate-400">Human: </span>
                                <span className="font-bold text-slate-200">{s.human_score}</span>
                              </div>
                              <button 
                                onClick={() => {
                                  sound.click();
                                  alert(`Confirmed teacher audit for ${s.student_id}.`);
                                }}
                                className="px-3 py-1.5 rounded bg-crimson-900 hover:bg-crimson text-white text-xs transition"
                              >
                                Approve AI Mark
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* --- TAB 4: EXPORT & SYSTEM AUDIT --- */}
                {activeTab === 'export' && (
                  <div className="p-6 rounded-xl border border-crimson-800/50 bg-blackred-900/90 shadow-panel space-y-6">
                    <div>
                      <h3 className="text-lg font-bold text-white">Full Batch Export & Psychometric Audit</h3>
                      <p className="text-xs text-slate-400 mt-1">
                        Download the comprehensive CSV report including student answers, dense semantic match percentages, rubric marks, and verified evidence quotes.
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-4">
                      <a 
                        href={`/api/export_csv?dataset_id=${encodeURIComponent(currentDatasetId)}`}
                        className="px-5 py-2.5 rounded-lg bg-gradient-to-r from-crimson to-crimson-800 hover:from-crimson-500 hover:to-crimson-700 text-white font-mono text-xs font-bold transition shadow-crimson-md flex items-center gap-2"
                      >
                        <span>📥 Download Graded Batch CSV</span>
                      </a>
                    </div>

                    <div className="p-4 rounded-lg bg-blackred-950 border border-crimson-900/40 space-y-2 text-xs font-mono">
                      <div className="font-bold text-champagne-gold">Quadratic Weighted Kappa (QWK) Reliability Index:</div>
                      <p className="text-slate-300 leading-relaxed font-sans">
                        QWK measures inter-rater agreement between the automated AI system and human evaluators, incorporating a quadratic penalty matrix where distant errors are penalized exponentially harder than adjacent errors:
                      </p>
                      <div className="p-2 rounded bg-blackred-900 text-champagne font-mono text-[11px]">
                        w_ij = (i - j)² / (N - 1)²  ➔  Current Score: {assessment.metrics.qwk_score.toFixed(4)} ({assessment.metrics.qwk_interpretation})
                      </div>
                    </div>
                  </div>
                )}

              </section>
            </>
          )}

          {/* --- FOOTER --- */}
          <footer className="pt-6 border-t border-crimson-900/40 flex flex-col md:flex-row items-center justify-between text-xs font-mono text-slate-500 gap-2">
            <div>QUBRIX Internal Hackathon • AIML Problem 2 (EdTech)</div>
            <div className="text-champagne-gold/60">Crafted with Three.js • WebGL • React 18 • FastAPI Backend</div>
          </footer>

        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
