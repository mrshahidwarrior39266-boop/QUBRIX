<body class="min-h-screen text-slate-100 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- PROCEDURAL WEB AUDIO SYNTHESIZER ---
    class CyberAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      play(freq, dur = 0.08, type = 'sine', vol = 0.06) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      }
      click() { this.play(800, 0.02, 'sine', 0.04); }
      tab() {
        this.play(520, 0.05, 'triangle', 0.05);
        setTimeout(() => this.play(680, 0.06, 'sine', 0.05), 35);
      }
      regrade() {
        [440, 554, 659, 880].forEach((f, i) => {
          setTimeout(() => this.play(f, 0.14, 'sine', 0.05), i * 30);
        });
      }
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }
    }
    const audio = new CyberAudio();

    // --- THREE.JS INTERACTIVE HOLOGRAPHIC SCENE ---
    function HolographicCore() {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lighting
        scene.add(new THREE.AmbientLight(0x220910, 1.8));

        const crimsonLight = new THREE.PointLight(0xE6193C, 40, 60);
        crimsonLight.position.set(8, 8, 8);
        scene.add(crimsonLight);

        const goldLight = new THREE.PointLight(0xF5D77F, 30, 50);
        goldLight.position.set(-8, -6, 6);
        scene.add(goldLight);

        // Hologram Group
        const coreGroup = new THREE.Group();
        scene.add(coreGroup);

        // Outer Celestial Ring (Crimson)
        const r1Geo = new THREE.TorusGeometry(5.2, 0.06, 16, 120);
        const r1Mat = new THREE.MeshBasicMaterial({ color: 0xE6193C, transparent: true, opacity: 0.7 });
        const ring1 = new THREE.Mesh(r1Geo, r1Mat);
        coreGroup.add(ring1);

        // Inner Celestial Ring (Champagne Gold)
        const r2Geo = new THREE.TorusGeometry(4.0, 0.05, 16, 100);
        const r2Mat = new THREE.MeshBasicMaterial({ color: 0xF5D77F, transparent: true, opacity: 0.6 });
        const ring2 = new THREE.Mesh(r2Geo, r2Mat);
        ring2.rotation.x = Math.PI / 3;
        coreGroup.add(ring2);

        // Central Crystal Icosahedron
        const icoGeo = new THREE.IcosahedronGeometry(2.4, 1);
        const icoMat = new THREE.MeshStandardMaterial({
          color: 0xE6193C,
          wireframe: true,
          transparent: true,
          opacity: 0.5,
          emissive: 0x5a0815,
          emissiveIntensity: 0.8
        });
        const icosahedron = new THREE.Mesh(icoGeo, icoMat);
        coreGroup.add(icosahedron);

        // Glowing Core Sphere
        const coreGeo = new THREE.SphereGeometry(1.0, 24, 24);
        const coreMat = new THREE.MeshStandardMaterial({
          color: 0xF5D77F,
          roughness: 0.1,
          metalness: 0.8,
          emissive: 0xF5D77F,
          emissiveIntensity: 0.9
        });
        const coreSphere = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(coreSphere);

        // Floating Equalizer / Criteria Columns in Background
        const barGroup = new THREE.Group();
        scene.add(barGroup);
        barGroup.position.set(0, -2, -3);

        const barCount = 10;
        const bars = [];
        for (let i = 0; i < barCount; i++) {
          const h = 1.2 + Math.random() * 3.5;
          const geo = new THREE.BoxGeometry(0.3, h, 0.3);
          const isGold = i % 3 === 0;
          const mat = new THREE.MeshStandardMaterial({
            color: isGold ? 0xF5D77F : 0x7d0c1e,
            emissive: isGold ? 0xF5D77F : 0x3d050e,
            emissiveIntensity: 0.3,
            roughness: 0.3
          });
          const mesh = new THREE.Mesh(geo, mat);
          const angle = (i / barCount) * Math.PI * 2;
          const radius = 7.5;
          mesh.position.set(Math.cos(angle) * radius, h / 2 - 2, Math.sin(angle) * radius);
          barGroup.add(mesh);
          bars.push({ mesh, baseH: h, freq: 1.2 + Math.random() });
        }

        // Particle Stardust Field (600 particles)
        const pCount = 600;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount * 3);
        const pCol = new Float32Array(pCount * 3);
        const cRed = new THREE.Color(0xE6193C);
        const cGold = new THREE.Color(0xF5D77F);

        for (let i = 0; i < pCount; i++) {
          const rad = 8 + Math.random() * 16;
          const th = Math.random() * Math.PI * 2;
          const ph = Math.acos(2 * Math.random() - 1);
          pPos[i * 3] = rad * Math.sin(ph) * Math.cos(th);
          pPos[i * 3 + 1] = (Math.random() - 0.5) * 12;
          pPos[i * 3 + 2] = rad * Math.sin(ph) * Math.sin(th);

          const c = Math.random() > 0.4 ? cRed : cGold;
          pCol[i * 3] = c.r;
          pCol[i * 3 + 1] = c.g;
          pCol[i * 3 + 2] = c.b;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
        const pMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.75 });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // Mouse Parallax
        let mouseX = 0, mouseY = 0;
        const onMouseMove = (e) => {
          mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
          mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        };
        window.addEventListener('mousemove', onMouseMove);

        // Animation Loop
        let animId;
        const clock = new THREE.Clock();
        const animate = () => {
          animId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          ring1.rotation.z = t * 0.18;
          ring1.rotation.y = t * 0.14;
          ring2.rotation.x = t * 0.22;
          icosahedron.rotation.y = t * 0.25;
          icosahedron.rotation.x = t * 0.12;

          coreSphere.scale.setScalar(1 + Math.sin(t * 2.5) * 0.08);

          bars.forEach((b, idx) => {
            const h = b.baseH + Math.sin(t * b.freq + idx) * 1.2;
            b.mesh.scale.y = Math.max(0.2, h / b.baseH);
          });

          particles.rotation.y = t * 0.025;

          camera.position.x += (mouseX * 3 - camera.position.x) * 0.04;
          camera.position.y += (-mouseY * 2.5 - camera.position.y) * 0.04;
          camera.lookAt(0, 0, 0);

          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', onResize);

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('resize', onResize);
          cancelAnimationFrame(animId);
          if (container && renderer.domElement) container.removeChild(renderer.domElement);
          renderer.dispose();
        };
      }, []);

      return (
        <div className="relative w-full h-[320px] md:h-[420px] flex items-center justify-center">
          <div ref={mountRef} className="absolute inset-0 cursor-crosshair"></div>
          
          {/* Subtle floating telemetry pill */}
          <div className="absolute top-4 right-4 z-10 font-mono text-[11px] text-slate-400 bg-obsidian-900/80 px-3 py-1 rounded-full border border-crimson-900/40 backdrop-blur-md">
            <span>60 FPS • THREE.JS WEBGL CORE</span>
          </div>

          <div className="absolute bottom-4 right-4 z-10 font-mono text-[10px] text-champagne-gold/70">
            <span>Drag cursor to orbit ➔</span>
          </div>
        </div>
      );
    }

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [datasets, setDatasets] = useState([]);
      const [activeDatasetId, setActiveDatasetId] = useState('biology');
      const [assessment, setAssessment] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const [activeTab, setActiveTab] = useState('evaluations'); // 'evaluations', 'regrade', 'borderline', 'export'
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [sliderWeights, setSliderWeights] = useState({});
      const [regradeReport, setRegradeReport] = useState(null);
      const [soundOn, setSoundOn] = useState(true);
      const [uploading, setUploading] = useState(false);

      // Load Datasets
      useEffect(() => {
        fetch('/api/datasets')
          .then(r => r.json())
          .then(d => setDatasets(d.datasets || []))
          .catch(e => setError('Failed to reach backend API. Ensure backend_api.py is running on port 8000.'));
      }, []);

      // Load Active Assessment
      useEffect(() => {
        setLoading(true);
        setError(null);
        fetch(`/api/assessment?dataset_id=${encodeURIComponent(activeDatasetId)}`)
          .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(data => {
            setAssessment(data);
            const w = {};
            (data.rubric || []).forEach(c => {
              w[c.criterion_id] = parseFloat(c.max_points);
            });
            setSliderWeights(w);
            setSelectedStudent(data.students && data.students[0] ? data.students[0] : null);
            setLoading(false);
          })
          .catch(e => {
            setError(e.message);
            setLoading(false);
          });
      }, [activeDatasetId]);

      // Regrade Trigger
      const runRegrade = (weights) => {
        fetch('/api/regrade', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dataset_id: activeDatasetId, slider_weights: weights })
        })
          .then(r => r.json())
          .then(res => {
            setRegradeReport(res);
            audio.regrade();
          })
          .catch(console.error);
      };

      const onSliderChange = (cid, val) => {
        audio.click();
        const updated = { ...sliderWeights, [cid]: parseFloat(val) };
        setSliderWeights(updated);
        runRegrade(updated);
      };

      const resetSliders = () => {
        audio.click();
        if (!assessment) return;
        const initial = {};
        assessment.rubric.forEach(c => initial[c.criterion_id] = parseFloat(c.max_points));
        setSliderWeights(initial);
        runRegrade(initial);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const form = new FormData();
        form.append('file', file);
        fetch('/api/upload', { method: 'POST', body: form })
          .then(r => r.json())
          .then(d => {
            setUploading(false);
            audio.regrade();
            fetch('/api/datasets').then(r => r.json()).then(dsData => {
              setDatasets(dsData.datasets || []);
              const customOpt = dsData.datasets.find(x => x.type === 'custom');
              if (customOpt) setActiveDatasetId(customOpt.id);
            });
          })
          .catch(err => {
            setUploading(false);
            alert('Upload failed: ' + err.message);
          });
      };

      // Verbatim Quote Highlighter
      const renderEvidenceAnswer = (text, criteriaEvals) => {
        if (!criteriaEvals || criteriaEvals.length === 0) return <span>{text}</span>;

        const quotes = criteriaEvals
          .filter(c => c.is_quote_verified && c.evidence_quote && c.evidence_quote.trim().length > 3)
          .map(c => c.evidence_quote.trim())
          .sort((a, b) => b.length - a.length);

        if (quotes.length === 0) return <span>{text}</span>;

        let parts = [{ text, isMatch: false }];
        quotes.forEach(quote => {
          const next = [];
          parts.forEach(p => {
            if (p.isMatch) { next.push(p); return; }
            const idx = p.text.toLowerCase().indexOf(quote.toLowerCase());
            if (idx !== -1) {
              const b = p.text.substring(0, idx);
              const m = p.text.substring(idx, idx + quote.length);
              const a = p.text.substring(idx + quote.length);
              if (b) next.push({ text: b, isMatch: false });
              next.push({ text: m, isMatch: true });
              if (a) next.push({ text: a, isMatch: false });
            } else {
              next.push(p);
            }
          });
          parts = next;
        });

        return (
          <span>
            {parts.map((p, i) => p.isMatch ? (
              <span key={i} className="evidence-tag">{p.text}</span>
            ) : (
              <span key={i}>{p.text}</span>
            ))}
          </span>
        );
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 md:px-8 space-y-8">
          
          {/* --- TOP FLOATING NAVBAR --- */}
          <nav className="flex items-center justify-between px-6 py-4 rounded-2xl border border-crimson-900/30 bg-obsidian-900/70 shadow-glass-panel backdrop-blur-xl">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-crimson-neon to-crimson-800 flex items-center justify-center shadow-glow-crimson border border-crimson-400/40">
                <span className="font-mono font-black text-champagne text-sm">RG</span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-white text-base tracking-tight">RubricGrader AI</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-crimson-950 border border-crimson-800 text-champagne-gold">
                    AIML-2 EDTECH
                  </span>
                </div>
                <div className="text-[11px] text-slate-400">Explainable Evaluation & Decoupled Regrading</div>
              </div>
            </div>

            <div className="flex items-center gap-3 font-mono text-xs">
              <div className="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-obsidian-950 border border-crimson-900/50 text-slate-300">
                <span className="w-2 h-2 rounded-full bg-champagne-gold animate-pulse"></span>
                <span>SPEED:</span>
                <span className="text-champagne-gold font-bold">
                  {regradeReport ? `${regradeReport.recalculation_latency_ms}ms` : '< 5ms'}
                </span>
              </div>

              <div className="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full bg-obsidian-950 border border-crimson-900/50 text-emerald-400">
                <span>✔ 4-Gram Guardrail</span>
              </div>

              {/* Sound Synthesizer Switch */}
              <button 
                onClick={() => {
                  const s = audio.toggle();
                  setSoundOn(s);
                  audio.click();
                }}
                className={`px-3 py-1 rounded-full border transition-all flex items-center gap-1.5 ${
                  soundOn 
                    ? 'bg-crimson-950 border-crimson-600 text-champagne-gold shadow-glow-crimson' 
                    : 'bg-obsidian-950 border-slate-800 text-slate-500'
                }`}
              >
                <span>{soundOn ? '🔊 SYNTH ON' : '🔇 MUTED'}</span>
              </button>

              <a 
                href="http://localhost:8501" 
                target="_blank" 
                rel="noreferrer"
                className="px-3.5 py-1 rounded-full bg-obsidian-950 hover:bg-crimson-950 border border-crimson-800 text-slate-300 hover:text-white transition"
              >
                Streamlit :8501 ➔
              </a>
            </div>
          </nav>

          {/* --- HERO SECTION: EDITORIAL SPLIT --- */}
          <section className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center pt-2">
            
            {/* Left 7 Columns: Editorial Headline & Pitch */}
            <div className="lg:col-span-7 space-y-6">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-obsidian-900 border border-crimson-800/60 shadow-sm text-xs font-mono text-champagne-gold">
                <span className="w-2 h-2 rounded-full bg-crimson-neon animate-pulse"></span>
                <span>QUBRIX 12-HOUR INTERNAL HACKATHON</span>
              </div>

              <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight leading-[1.08] text-white">
                Explainable AI <br />
                <span className="grad-crimson-gold">Short-Answer</span> <br />

                      </div>
                      <span className="font-mono text-xs text-crimson-400 bg-crimson-950 px-3 py-1 rounded-full border border-crimson-800">
                        {assessment.metrics.borderline_count} Cases Flagged
                      </span>
                    </div>

                    <div className="space-y-3">
                      {assessment.students.filter(s => s.is_borderline).length === 0 ? (
                        <div className="p-12 text-center text-slate-400 font-mono text-xs">
                          🎉 Zero borderline discrepancies detected. AI evaluations align seamlessly with human benchmark grades.
                        </div>
                      ) : (
                        assessment.students.filter(s => s.is_borderline).map(s => (
                          <div key={s.student_id} className="p-4 rounded-xl bg-obsidian-950 border border-crimson-800/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span className="font-mono font-bold text-white text-base">{s.student_id}</span>
                                <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-crimson-950 text-crimson-300 border border-crimson-800">
                                  Discrepancy: {s.score_discrepancy.toFixed(1)} pts
                                </span>
                              </div>
                              <p className="text-xs text-slate-300 line-clamp-2">{s.student_answer}</p>
                            </div>

                            <div className="flex items-center gap-4 font-mono text-xs shrink-0">
                              <div>
                                <span className="text-slate-400">AI: </span>
                                <span className="font-bold text-champagne-gold">{s.rubric_score}</span>
                              </div>
                              <div>
                                <span className="text-slate-400">Human: </span>
                                <span className="font-bold text-slate-200">{s.human_score}</span>
                              </div>
                              <button 
                                onClick={() => {
                                  audio.click();
                                  alert(`Confirmed teacher audit for ${s.student_id}.`);
                                }}
                                className="px-4 py-2 rounded-xl bg-crimson hover:bg-crimson-600 text-white text-xs font-bold transition shadow-glow-crimson"
                              >
                                Approve Mark
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* --- TAB 4: EXPORT & AUDIT --- */}
                {activeTab === 'export' && (
                  <div className="p-6 rounded-2xl border border-crimson-800/40 bg-obsidian-900/90 shadow-glass-panel space-y-6">
                    <div>
                      <h3 className="text-lg font-bold text-white">Full Batch Export & Psychometric Audit</h3>
                      <p className="text-xs text-slate-400 mt-1">
                        Download comprehensive grading sheets containing dense vector similarity, rubric points, and feedback.
                      </p>
                    </div>

                    <div>
                      <a 
                        href={`/api/export_csv?dataset_id=${encodeURIComponent(activeDatasetId)}`}
                        className="inline-flex px-6 py-3 rounded-xl bg-gradient-to-r from-crimson-neon via-crimson to-crimson-800 hover:opacity-95 text-white font-mono text-xs font-bold transition shadow-glow-crimson items-center gap-2"
                      >
                        <span>📥 Download Graded Batch Report (.CSV)</span>
                      </a>
                    </div>

                    <div className="p-5 rounded-xl bg-obsidian-950 border border-crimson-900/40 space-y-2 text-xs font-mono">
                      <div className="font-bold text-champagne-gold">Quadratic Weighted Kappa (QWK) Agreement Metric:</div>
                      <p className="text-slate-300 leading-relaxed font-sans">
                        Measures inter-rater agreement on a discrete scale, penalizing large discrepancies quadratically ($w_{ij} = (i-j)^2 / (N-1)^2$).
                      </p>
                      <div className="p-3 rounded-lg bg-obsidian-900 text-champagne-gold font-mono text-xs border border-crimson-900/30">
                        Current Kappa Score: {assessment.metrics.qwk_score.toFixed(4)} ({assessment.metrics.qwk_interpretation})
                      </div>
                    </div>
                  </div>
                )}

              </section>
            </>
          )}

          {/* --- FOOTER --- */}
          <footer className="pt-8 pb-4 border-t border-crimson-900/30 flex flex-col sm:flex-row items-center justify-between text-xs font-mono text-slate-500 gap-3">
            <div>QUBRIX Hackathon • AIML Problem 2 (EdTech)</div>
            <div className="text-champagne-gold/70">Engineered with React 18 • Three.js WebGL • FastAPI</div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
