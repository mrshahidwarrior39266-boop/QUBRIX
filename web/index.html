<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TABS = [
      { id: 'submissions', label: 'Submissions' },
      { id: 'regrade', label: 'Rubric & Regrade' },
      { id: 'review', label: 'Review Queue' },
      { id: 'export', label: 'Export' }
    ];

    const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
    const cohortLabel = (ds) => {
      if (ds.type === 'custom') return (ds.name || '').replace(/^\s*📁\s*Custom:\s*/, 'Custom · ');
      return ds.subject || ds.name;
    };

    function Dot({ tone }) {
      const map = { high: 'bg-sage-600', medium: 'bg-brass-600', low: 'bg-wine-600', muted: 'bg-ink-300' };
      return <span className={`inline-block w-1.5 h-1.5 rounded-full ${map[tone] || map.muted}`}></span>;
    }

    function ConfidenceBadge({ confidence }) {
      const tone = confidence.label === 'High'
        ? 'bg-sage-100 text-sage-700 border-sage-600/25'
        : confidence.label === 'Medium'
          ? 'bg-brass-100 text-brass-700 border-brass-600/30'
          : 'bg-wine-100 text-wine-600 border-wine-600/25';
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full border px-2 py-0.5 text-[10px] font-medium uppercase tracking-[0.12em] ${tone}`}>
          <Dot tone={confidence.label.toLowerCase()} />
          {confidence.label} confidence
        </span>
      );
    }

    function StatusBadge({ status }) {
      const styles = {
        FULL: 'bg-sage-100 text-sage-700 border-sage-600/25',
        PARTIAL: 'bg-clay-100 text-clay-700 border-clay-600/30',
        NONE: 'bg-wine-100 text-wine-600 border-wine-600/25'
      };
      return (
        <span className={`inline-flex justify-center rounded-md border px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.1em] ${styles[status] || styles.NONE}`}>
          {status}
        </span>
      );
    }

    function SemanticMap({ students, selectedId, onSelect }) {
      if (!students || students.length === 0) {
        return <div className="h-[210px] flex items-center justify-center text-xs text-ink-400">No submissions to plot yet.</div>;
      }
      const W = 340, H = 214, cx = W / 2, cy = H / 2 + 2;
      const inner = 24, outer = 92;
      const radiusFor = (fraction) => inner + (1 - fraction) * (outer - inner);
      const rings = [1, 0.75, 0.5, 0.25, 0];
      const points = students.map((s, i) => {
        const sim = Math.max(0, Math.min(1, Number(s.semantic_similarity) || 0));
        const r = radiusFor(sim);
        const angle = (i / Math.max(1, students.length)) * Math.PI * 2 - Math.PI / 2;
        return { s, x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r, sim };
      });
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="Semantic similarity map of each submission against the reference answer">
          {rings.map((f) => (
            <circle
              key={f}
              cx={cx}
              cy={cy}
              r={radiusFor(f)}
              fill="none"
              stroke="#E1D8C9"
              strokeWidth={f === 0 || f === 1 ? 1 : 0.75}
              strokeDasharray={f === 1 || f === 0 ? '0' : '3 4'}
            />
          ))}
          <text x={cx + 4} y={radiusFor(1) + 13} className="font-mono" fontSize="7.5" fill="#8B8078">100%</text>
          <text x={cx + 4} y={radiusFor(0.25) + 3} className="font-mono" fontSize="7.5" fill="#8B8078">25%</text>
          <text x={cx + 4} y={cy + outer + 12} className="font-mono" fontSize="7.5" fill="#8B8078">0%</text>

          <circle cx={cx} cy={cy} r={7} fill="#A9864C" />
          <circle cx={cx} cy={cy} r={12} fill="none" stroke="#A9864C" strokeOpacity="0.35" />
          <text x={cx} y={cy + 26} textAnchor="middle" className="font-mono" fontSize="7.5" fill="#6E645C">reference</text>

          {points.map(({ s, x, y, sim }) => {
            const selected = s.student_id === selectedId;
            return (
              <g key={s.student_id} onClick={() => onSelect(s.student_id)} className="cursor-pointer">
                <title>{`${s.student_id} · ${Math.round(sim * 100)}% semantic match`}</title>
                <circle cx={x} cy={y} r={selected ? 9 : 7} fill="transparent" />
                <circle cx={x} cy={y} r={selected ? 5.4 : 4} fill={selected ? '#171310' : '#7A2230'} stroke="#F6F3EC" strokeWidth="1.5" />
                {selected && (
                  <text x={x + 8} y={y + 3} className="font-mono" fontSize="8" fill="#171310">{s.student_id}</text>
                )}
              </g>
            );
          })}
        </svg>
      );
    }

                </button>

            </div>
          </header>

          {/* Hero Section */}
          <section className="relative overflow-hidden pt-12 pb-14 lg:pt-20 lg:pb-22 border-b border-line">
            <div className="mx-auto max-w-[1200px] px-4 sm:px-6 lg:px-8 text-center space-y-6">

              <h1 className="font-display text-4xl sm:text-5xl lg:text-6xl text-ink-900 tracking-tight leading-[1.12] max-w-4xl mx-auto">

              <p className="max-w-2xl mx-auto text-base sm:text-lg text-ink-500 leading-relaxed font-normal">
                An objective, evidence-anchored short-answer grading platform. Grounded in dense vector semantic similarity, character-accurate verbatim quotation validation, and deterministic sub-5ms regrading.
              </p>

              <div className="pt-3 flex flex-wrap items-center justify-center gap-3.5">
                <button
                  type="button"
                  onClick={() => onGetStarted()}
                  className="inline-flex items-center gap-2.5 rounded-xl bg-wine-600 px-6 py-3.5 text-sm font-semibold text-paper shadow-lift hover:bg-wine-700 transition cursor-pointer"
                >
                  <span>Get Started</span>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">

                <button

          {/* Key Metrics Strip */}
          <section className="border-b border-line bg-paper-soft py-10">

              <div className="rounded-2xl border border-line bg-paper-card p-6 sm:p-8 shadow-card space-y-6">
                <div className="border-b border-line pb-4 flex flex-col sm:flex-row sm:items-baseline justify-between gap-2">
                  <div>
                    <span className="text-[10px] font-semibold uppercase tracking-[0.14em] text-ink-400">Sample Question</span>
                    <h3 className="font-display text-lg text-ink-900 mt-1">Explain the primary biological purpose of cellular respiration.</h3>

    function App() {
      const readRoute = () => {
        const raw = (window.location.hash || '').replace(/^#\/?/, '');
        const parts = raw.split('/');
        const aliases = { evaluations: 'submissions', borderline: 'review' };
        const rawTab = aliases[parts[1]] || parts[1];
        const dsSlug = (parts[0] && parts[0] !== 'landing' && parts[0] !== 'studio') ? decodeURIComponent(parts[0]) : null;
        return {
          dataset: dsSlug,
          tab: TABS.some(t => t.id === rawTab) ? rawTab : null
        };
      };
      const initialRoute = readRoute();

      const [datasets, setDatasets] = useState([]);
      const [activeDatasetId, setActiveDatasetId] = useState(initialRoute.dataset || 'biology');
      const [assessment, setAssessment] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [health, setHealth] = useState(null);

      const [activeTab, setActiveTab] = useState(initialRoute.tab || 'submissions');
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [showHighlights, setShowHighlights] = useState(true);
      const [sliderWeights, setSliderWeights] = useState({});
      const [regradeReport, setRegradeReport] = useState(null);
      const [regrading, setRegrading] = useState(false);
      const [regradeError, setRegradeError] = useState(null);

      const [uploading, setUploading] = useState(false);
      const [uploadMessage, setUploadMessage] = useState(null);
      const [reviewed, setReviewed] = useState({});
      const [reloadKey, setReloadKey] = useState(0);
      const [query, setQuery] = useState('');
      const [onlyReview, setOnlyReview] = useState(false);

      const [pageView, setPageView] = useState(() => {
        const hash = (window.location.hash || '').toLowerCase();
        if (hash.includes('studio') || hash.includes('cohort') || hash.includes('submissions') || hash.includes('regrade') || hash.includes('review') || hash.includes('export')) {
          return 'studio';
        }
        return 'landing';
      });
      const [removingCustom, setRemovingCustom] = useState(false);

      const handleGetStarted = (datasetId = null) => {
        const targetId = datasetId || activeDatasetId || 'biology';
        setActiveDatasetId(targetId);
        setPageView('studio');
        window.location.hash = `#${encodeURIComponent(targetId)}/submissions`;
      };

      const handleRemoveCustom = async () => {
        if (!window.confirm('Remove custom uploaded CSV files and restore standard benchmark cohorts?')) return;
        setRemovingCustom(true);
        try {
          const r = await fetch('/api/custom_dataset/clear', { method: 'POST' });
          if (!r.ok) throw new Error('Failed to remove custom dataset');
          const dsRes = await fetch('/api/datasets');
          const dsData = dsRes.ok ? await dsRes.json() : { datasets: [] };
          setDatasets(dsData.datasets || []);
          setActiveDatasetId('biology');
          setUploadMessage({ ok: true, text: 'Custom CSV dataset removed. Reverted to standard benchmark cohorts.' });
          fetch('/api/health').then(x => (x.ok ? x.json() : null)).then(d => d && setHealth(d)).catch(() => {});
        } catch (err) {
          setUploadMessage({ ok: false, text: err.message });
        } finally {
          setRemovingCustom(false);
        }
      };

      useEffect(() => {
        const onHashChange = () => {
          const hash = (window.location.hash || '').toLowerCase();
          if (hash.includes('landing') || !hash) {
            setPageView('landing');
          } else {
            setPageView('studio');
            const route = readRoute();
            if (route.dataset && route.dataset !== activeDatasetId) {
              setActiveDatasetId(route.dataset);
            }
            if (route.tab && route.tab !== activeTab) {
              setActiveTab(route.tab);
            }
          }
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, [activeDatasetId, activeTab]);

      const regradeSeq = useRef(0);
      const debounceRef = useRef(null);

      // Engine status (local embeddings + offline cache) for the header chips.
      useEffect(() => {
        let cancelled = false;
        fetch('/api/health')
          .then(r => (r.ok ? r.json() : null))
          .then(d => { if (!cancelled && d) setHealth(d); })
          .catch(() => {});
        return () => { cancelled = true; };
      }, [reloadKey]);

      useEffect(() => {
        let cancelled = false;
        fetch('/api/datasets')
          .then(r => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
          .then(d => { if (!cancelled) setDatasets(d.datasets || []); })
          .catch(() => {
            if (!cancelled) setError('Could not reach the grading engine. Make sure backend_api.py is running on port 8000, then retry.');
          });
        return () => { cancelled = true; };
      }, [reloadKey]);

      // Load the active cohort; reset all derived state so numbers can never leak across cohorts.
      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        setError(null);
        setAssessment(null);
        setRegradeReport(null);
        setRegradeError(null);
        setRegrading(false);
        setQuery('');
        setOnlyReview(false);
        clearTimeout(debounceRef.current);
        regradeSeq.current += 1;

        fetch('/api/datasets')
          .then(r => (r.ok ? r.json() : null))
          .then(d => { if (!cancelled && d) setDatasets(d.datasets || []); })
          .catch(() => {});

        fetch(`/api/assessment?dataset_id=${encodeURIComponent(activeDatasetId)}`)
          .then(async r => {
            if (!r.ok) {
              let detail = `HTTP ${r.status}`;
              try {
                const body = await r.json();
                if (body && body.detail) detail = typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail);
              } catch (err) { /* non-JSON error body */ }
              throw new Error(detail);
            }
            return r.json();
          })
          .then(data => {
            if (cancelled) return;
            setAssessment(data);
            const w = {};
            (data.rubric || []).forEach(c => { w[c.criterion_id] = parseFloat(c.max_points); });
            setSliderWeights(w);
            setSelectedStudent(data.students && data.students[0] ? data.students[0] : null);
            setLoading(false);
          })
          .catch(e => {
            if (cancelled) return;
            setError(`Could not load this cohort: ${e.message}`);
            setLoading(false);
          });
        return () => { cancelled = true; };
      }, [activeDatasetId, reloadKey]);

      useEffect(() => () => clearTimeout(debounceRef.current), []);

      // URL reflects cohort + tab, so refresh / back / forward restore the workspace.
      useEffect(() => {
        const hash = `#${encodeURIComponent(activeDatasetId)}/${activeTab}`;
        if (window.location.hash !== hash) window.history.pushState(null, '', hash);
      }, [activeDatasetId, activeTab]);

      useEffect(() => {
        const onRouteChange = () => {
          const route = readRoute();
          if (route.dataset) setActiveDatasetId(route.dataset);
          if (route.tab) setActiveTab(route.tab);
        };
        window.addEventListener('popstate', onRouteChange);
        window.addEventListener('hashchange', onRouteChange);
        return () => {
          window.removeEventListener('popstate', onRouteChange);
          window.removeEventListener('hashchange', onRouteChange);
        };
      }, []);

      const runRegrade = async (weights) => {
        const seq = ++regradeSeq.current;
        setRegrading(true);
        setRegradeError(null);
        try {
          const r = await fetch('/api/regrade', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dataset_id: activeDatasetId, slider_weights: weights })
          });
          let body = null;
          try { body = await r.json(); } catch (err) { /* ignore */ }
          if (!r.ok) throw new Error(body && body.detail ? body.detail : `HTTP ${r.status}`);
          if (seq !== regradeSeq.current) return;
          setRegradeReport(body);
        } catch (e) {
          if (seq === regradeSeq.current) setRegradeError(`Could not recalculate: ${e.message}`);
        } finally {
          if (seq === regradeSeq.current) setRegrading(false);
        }
      };

      const scheduleRegrade = (weights) => {
        clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => runRegrade(weights), 140);
      };

      const onSliderChange = (cid, val) => {
        const numeric = Math.max(0, Math.min(1000, parseFloat(val) || 0));
        const updated = { ...sliderWeights, [cid]: numeric };
        setSliderWeights(updated);
        scheduleRegrade(updated);
      };

      const resetSliders = () => {
        if (!assessment) return;
        const initial = {};
        (assessment.rubric || []).forEach(c => { initial[c.criterion_id] = parseFloat(c.max_points); });
        clearTimeout(debounceRef.current);
        regradeSeq.current += 1;
        setRegrading(false);
        setRegradeReport(null);
        setRegradeError(null);
        setSliderWeights(initial);
      };

      const handleFileUpload = async (e) => {
        const input = e.target;
        const file = input.files && input.files[0];
        if (!file) return;
        setUploading(true);
        setUploadMessage(null);
        const form = new FormData();
        form.append('file', file);
        try {
          const r = await fetch('/api/upload', { method: 'POST', body: form });
          let body = null;
          try { body = await r.json(); } catch (err) { /* ignore */ }
          if (!r.ok) throw new Error(body && body.detail ? body.detail : `Upload failed (HTTP ${r.status})`);

          const dsRes = await fetch('/api/datasets');
          const dsData = dsRes.ok ? await dsRes.json() : { datasets: [] };
          setDatasets(dsData.datasets || []);
          fetch('/api/health').then(x => (x.ok ? x.json() : null)).then(d => d && setHealth(d)).catch(() => {});

          const subjectCount = (body.subjects || []).length;
          setUploadMessage({
            ok: true,
            text: `Loaded ${body.rows_count} submission${body.rows_count === 1 ? '' : 's'} from “${body.filename}”. Subject${subjectCount === 1 ? '' : 's'}: ${(body.subjects || []).join(', ')}`
          });

          const target = `custom:${body.default_subject}`;
          if (target === activeDatasetId) setReloadKey(k => k + 1);
          else setActiveDatasetId(target);
        } catch (err) {
          setUploadMessage({ ok: false, text: err.message });
        } finally {
          setUploading(false);
          if (input) input.value = '';
        }
      };

      // ---- Derived values: one weight-aware source of truth for every visible mark ----
      const weightFor = (c) => (sliderWeights[c.criterion_id] !== undefined ? sliderWeights[c.criterion_id] : parseFloat(c.max_points));
      const scoreOf = (student) => {
        if (!student || !student.rubric_results) return 0;
        return round2(student.rubric_results.reduce((sum, c) => {
          const w = sliderWeights[c.criterion_id] !== undefined ? sliderWeights[c.criterion_id] : parseFloat(c.max_points);
          const mult = (c.multiplier !== undefined && c.multiplier !== null)
            ? c.multiplier
            : (c.status === 'FULL' ? 1 : c.status === 'PARTIAL' ? 0.5 : 0);
          return sum + w * mult;
        }, 0));
      };
      const currentMax = assessment
        ? round2((assessment.rubric || []).reduce((sum, c) => sum + weightFor(c), 0))
        : 0;
      const weightsChanged = !!(assessment && (assessment.rubric || []).some(
        c => Math.abs(weightFor(c) - parseFloat(c.max_points)) > 1e-9
      ));
      const avgDerived = assessment && assessment.students.length
        ? round2(assessment.students.reduce((sum, s) => sum + scoreOf(s), 0) / assessment.students.length)
        : 0;

      const confidenceOf = (student) => {
        const evals = student.rubric_results || [];
        const ai = scoreOf(student);
        let score = 100;
        const reasons = [];
        const unverified = evals.filter(c => c.evidence_quote && !c.is_quote_verified);
        if (unverified.length) {
          score -= Math.min(30, 15 * unverified.length);
          reasons.push(`${unverified.length} evidence quote${unverified.length > 1 ? 's' : ''} could not be verified verbatim`);
        }
        if (Number(student.semantic_similarity) < 0.45) {
          score -= 15;
          reasons.push('Answer is only loosely aligned with the reference answer');
        }
        const human = student.human_score;
        if (human !== null && human !== undefined) {
          const gap = Math.abs(ai - human);
          if (gap >= 1.5) {
            score -= 30;
            reasons.push(`AI–human gap of ${gap.toFixed(2)} marks`);
          } else if (gap >= 1.0) {
            score -= 12;
            reasons.push(`AI–human gap of ${gap.toFixed(2)} marks`);
          }
        }
        score = Math.max(0, Math.min(100, Math.round(score)));
        const label = score >= 80 ? 'High' : score >= 55 ? 'Medium' : 'Low';
        if (reasons.length === 0) reasons.push('Evidence verified and marks align with the human benchmark');
        return { score, label, reasons };
      };

      const discrepancyOf = (s) => (s.human_score === null || s.human_score === undefined)
        ? null
        : round2(Math.abs(scoreOf(s) - s.human_score));
      const isFlagged = (s) => { const d = discrepancyOf(s); return d !== null && d >= 1.5; };
      const needsReview = (s) => isFlagged(s) || confidenceOf(s).label === 'Low';

      const reviewKey = (s) => `${activeDatasetId}::${s.student_id}`;
      const isReviewed = (s) => !!reviewed[reviewKey(s)];
      const flaggedCount = assessment ? assessment.students.filter(needsReview).length : 0;
      const pendingReviews = assessment ? assessment.students.filter(s => needsReview(s) && !isReviewed(s)).length : 0;

      const approveReview = (s) => setReviewed(prev => ({ ...prev, [reviewKey(s)]: true }));
      const undoReview = (s) => setReviewed(prev => {
        const next = { ...prev };
        delete next[reviewKey(s)];
        return next;
      });

      const qwkInfo = (regradeReport && regradeReport.new_qwk && weightsChanged)
        ? regradeReport.new_qwk
        : (assessment ? assessment.metrics : { qwk_score: 0, qwk_interpretation: '—' });
      const qwkDisplay = (!assessment || qwkInfo.qwk_interpretation === 'Insufficient Data')
        ? '—'
        : Number(qwkInfo.qwk_score).toFixed(3);

      const engineLabel = assessment
        ? (assessment.metrics.semantic_engine === 'sentence-transformers' ? 'MiniLM · local' : 'TF-IDF · fallback')
        : 'local engine';
      const engineNote = assessment && assessment.metrics.semantic_engine === 'sentence-transformers'
        ? 'Dense sentence embeddings run on this machine'
        : 'Lexical fallback active because the embedding model is unavailable';

      const reviewedIds = Object.keys(reviewed)
        .filter(k => k.startsWith(activeDatasetId + '::'))
        .map(k => k.split('::')[1]);
      const exportHref = '/api/export_csv?dataset_id=' + encodeURIComponent(activeDatasetId)
        + '&weights=' + encodeURIComponent(JSON.stringify(sliderWeights))
        + '&reviewed=' + encodeURIComponent(reviewedIds.join(','));
      const reportHref = selectedStudent
        ? '/api/report?dataset_id=' + encodeURIComponent(activeDatasetId)
          + '&student_id=' + encodeURIComponent(selectedStudent.student_id)
          + '&weights=' + encodeURIComponent(JSON.stringify(sliderWeights))
          + '&reviewed=' + (isReviewed(selectedStudent) ? '1' : '0')
        : '#';

      const diffRows = assessment ? assessment.students.map(s => {
        const oldScore = round2(s.rubric_score);
        const newScore = scoreOf(s);
        const delta = round2(newScore - oldScore);
        const serverRow = regradeReport && (regradeReport.diff_rows || []).find(r => r.student_id === s.student_id);
        const explanation = serverRow
          ? serverRow.explanation
          : (Math.abs(delta) < 1e-9 ? 'No weight change applied — baseline marks.' : 'Recomputed from current weights…');
        return {
          student_id: s.student_id,
          old_score: oldScore,
          new_score: newScore,
          score_delta: delta,
          change_status: delta > 0 ? 'Increased' : delta < 0 ? 'Decreased' : 'Unchanged',
          explanation
        };
      }) : [];

      const visibleStudents = assessment ? assessment.students.filter(s => {
        if (onlyReview && !needsReview(s)) return false;
        if (!query.trim()) return true;
        const haystack = `${s.student_id} ${s.student_answer}`.toLowerCase();
        return haystack.includes(query.trim().toLowerCase());
      }) : [];

      const quotes = (student) => {
        const evals = student.rubric_results || [];
        const withQuotes = evals.filter(c => c.evidence_quote);
        return { verified: withQuotes.filter(c => c.is_quote_verified).length, total: withQuotes.length };
      };

      const renderEvidenceAnswer = (text, criteriaEvals) => {
        if (!text || !String(text).trim()) {
          return <em className="text-ink-400">No response submitted.</em>;
        }
        if (!criteriaEvals || criteriaEvals.length === 0) return <span>{text}</span>;

        const quotesList = criteriaEvals
          .filter(c => c.is_quote_verified && c.evidence_quote && c.evidence_quote.trim().length > 3)
          .map(c => c.evidence_quote.trim())
          .sort((a, b) => b.length - a.length);
        if (quotesList.length === 0) return <span>{text}</span>;

        let parts = [{ text, isMatch: false }];
        quotesList.forEach((quote) => {
          const next = [];
          parts.forEach((p) => {
            if (p.isMatch) { next.push(p); return; }
            const idx = p.text.toLowerCase().indexOf(quote.toLowerCase());
            if (idx !== -1) {
              const before = p.text.substring(0, idx);
              const match = p.text.substring(idx, idx + quote.length);
              const after = p.text.substring(idx + quote.length);
              if (before) next.push({ text: before, isMatch: false });
              next.push({ text: match, isMatch: true });
              if (after) next.push({ text: after, isMatch: false });
            } else {
              next.push(p);
            }
          });
          parts = next;
        });

        return (
          <span>
            {parts.map((p, i) => p.isMatch
              ? <span key={i} className="evidence">{p.text}</span>
              : <span key={i}>{p.text}</span>
            )}
          </span>
        );
      };

      const selectedConfidence = selectedStudent ? confidenceOf(selectedStudent) : null;
      const selectedQuotes = selectedStudent ? quotes(selectedStudent) : { verified: 0, total: 0 };

      if (pageView === 'landing') {
        return (
          <LandingPage
            onGetStarted={handleGetStarted}
            health={health}
            datasets={datasets}
          />
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* ---------- TOP BAR ---------- */}
          <header className="sticky top-0 z-30 border-b border-line bg-paper/85 backdrop-blur-md">
            <div className="mx-auto max-w-[1400px] px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-4">
              <div 
                onClick={() => { setPageView('landing'); window.location.hash = '#landing'; }}
                className="flex items-center gap-3 min-w-0 cursor-pointer group select-none"
                title="Click to view Landing Page"
              >
                <div className="h-9 w-9 rounded-xl bg-wine-600 text-paper flex items-center justify-center font-display text-sm tracking-tight shadow-sm shrink-0 group-hover:bg-wine-700 transition">
                  RG
                </div>
                <div className="min-w-0">
                  <div className="font-display text-[17px] leading-none text-ink-900 flex items-center gap-2">
                    <span>RubricGrader</span>
                    <span className="text-[10px] font-sans font-normal text-wine-600 group-hover:underline">← Home</span>
                  </div>
                  <div className="mt-1 text-[10px] font-medium uppercase tracking-[0.16em] text-ink-400 truncate">Explainable grading studio</div>
                </div>
              </div>

              <div className="ml-auto flex items-center gap-2 sm:gap-3">
                <button
                  type="button"
                  onClick={() => { setPageView('landing'); window.location.hash = '#landing'; }}
                  className="hidden sm:inline-flex items-center gap-1.5 rounded-lg border border-line bg-paper-card px-3 py-1.5 text-xs font-medium text-ink-700 hover:border-wine-600/40 hover:text-wine-600 transition"
                  title="Return to the Landing Page"
                >
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                  <span>Landing Page</span>
                </button>
                <span
                  className="hidden md:inline-flex items-center gap-1.5 rounded-full border border-line bg-paper-card px-3 py-1.5 text-[10px] font-medium uppercase tracking-[0.12em] text-ink-500"
                  title={engineNote}
                >
                  <Dot tone="high" /> {engineLabel}
                </span>
                <span
                  className="hidden lg:inline-flex items-center gap-1.5 rounded-full border border-line bg-paper-card px-3 py-1.5 text-[10px] font-medium uppercase tracking-[0.12em] text-ink-500"
                  title="Evaluations cached on disk; the dashboard keeps working without a network connection."
                >
                  Offline cache {health ? health.cache_entries : '—'}
                </span>
                {assessment && (
                  <a
                    href={exportHref}
                    download={`rubricgrader_${activeDatasetId.replace(':', '_')}.csv`}
                    className="inline-flex items-center gap-2 rounded-lg bg-wine-600 px-3.5 py-2 text-xs font-medium text-paper transition hover:bg-wine-700"
                  >
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="7 10 12 15 17 10"></polyline>
                      <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Export<span className="hidden sm:inline"> CSV</span></span>
                  </a>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 mx-auto w-full max-w-[1400px] px-4 sm:px-6 lg:px-8 py-6 lg:py-8 space-y-6">
            {/* ---------- COHORT SWITCHER ---------- */}
            <section className="space-y-3">
              <div className="flex items-end justify-between gap-4">
                <div>
                  <div className="text-[10px] font-semibold uppercase tracking-[0.18em] text-ink-400">Assessment library</div>
                  <h1 className="mt-1 font-display text-[22px] leading-tight text-ink-900">Choose a cohort to grade</h1>
                </div>
                <div className="flex items-center gap-2">
                  {datasets.some(d => d.type === 'custom') && (
                    <button
                      type="button"
                      onClick={handleRemoveCustom}
                      disabled={removingCustom}
                      className="shrink-0 inline-flex items-center gap-1.5 rounded-lg border border-wine-600/30 bg-wine-100/70 px-3 py-2 text-xs font-medium text-wine-700 hover:bg-wine-100 transition shadow-sm"
                      title="Remove custom uploaded CSV files and restore benchmark datasets"
                    >
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                      </svg>
                      <span>{removingCustom ? 'Removing…' : 'Remove Custom CSV'}</span>
                    </button>
                  )}
                  <label className={`shrink-0 inline-flex items-center gap-2 rounded-lg border px-3 py-2 text-xs font-medium transition cursor-pointer ${
                    uploading ? 'border-line bg-paper-deep text-ink-400' : 'border-line-strong bg-paper-card text-ink-700 hover:border-wine-600/40 hover:text-wine-600'
                  }`}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                      <polyline points="17 8 12 3 7 8"></polyline>
                      <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    {uploading ? 'Reading file…' : 'Upload CSV'}
                    <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" disabled={uploading} aria-label="Upload a grading CSV" />
                  </label>
                </div>
              </div>

              <div className="flex flex-wrap gap-2" role="tablist" aria-label="Assessment library">
                {datasets.map(ds => {
                  const active = activeDatasetId === ds.id;
                  return (
                    <button
                      key={ds.id}
                      type="button"
                      role="tab"

                            Reset
                          </button>
                        </div>

                        {currentMax === 0 && (
                          <div className="rounded-lg border border-clay-600/30 bg-clay-100 px-3 py-2 text-[11px] leading-relaxed text-clay-700">
                            Every criterion is set to 0 marks, so each submission now scores 0. Raise at least one criterion to restore scoring.
                          </div>
                        )}

                        <div className="space-y-5">
                          {(assessment.rubric || []).map(c => {
                            const original = parseFloat(c.max_points);
                            const currentVal = sliderWeights[c.criterion_id] !== undefined ? sliderWeights[c.criterion_id] : original;
                            const sliderMax = Math.max(5, Math.ceil(original));
                            const changed = Math.abs(currentVal - original) > 1e-9;
                            return (
                              <div key={c.criterion_id}>
                                <div className="flex items-start justify-between gap-3">
                                  <div className="min-w-0">
                                    <div className="flex items-center gap-2">
                                      <span className="rounded bg-ink-900 px-1.5 py-0.5 font-mono text-[10px] text-paper">{c.criterion_id}</span>
                                      <span className={`font-mono text-xs ${changed ? 'text-wine-600' : 'text-ink-900'}`}>{currentVal.toFixed(1)} pts</span>
                                    </div>
                                    <p className="mt-1 text-[11px] leading-relaxed text-ink-500">{c.description}</p>
                                  </div>
                                  <span className="shrink-0 font-mono text-[10px] text-ink-400">was {original.toFixed(1)}</span>
                                </div>
                                <input
                                  type="range"
                                  min="0"
                                  max={sliderMax}
                                  step="0.5"
                                  value={currentVal}
                                  aria-label={`${c.criterion_id} maximum marks: ${c.description}`}
                                  onChange={(e) => onSliderChange(c.criterion_id, e.target.value)}
                                  className="mt-2"
                                />
                                <div className="flex justify-between font-mono text-[9px] text-ink-300">
                                  <span>0 · ignore</span>
                                  <span>{sliderMax.toFixed(1)} · max</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        <div className="rounded-lg border border-line bg-paper-soft px-3 py-2.5">
                          <div className="flex items-center justify-between font-mono text-[11px] text-ink-500">
                            <span>Total marks</span>
                            <span className="text-ink-900">{currentMax.toFixed(1)}</span>
                          </div>
                          <div className="mt-1 flex items-center justify-between font-mono text-[11px] text-ink-500">
                            <span>Baseline total</span>
                            <span>{assessment.metrics.max_possible_score.toFixed(1)}</span>
                          </div>
                        </div>
                      </div>

                      <div className="rounded-2xl border border-line bg-paper-card shadow-card">
                        <div className="px-5 py-4 border-b border-line flex flex-wrap items-center justify-between gap-3">
                          <div>
                            <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-ink-400">Live regrade</div>
                            <p className="mt-1 text-[11px] text-ink-500">Before and after marks with plain-English justifications.</p>
                          </div>
                          <div className="font-mono text-[10px] text-ink-500 rounded-full border border-line bg-paper-soft px-2.5 py-1">
                            {regrading ? 'Recalculating…' : regradeReport
                              ? `recalc ${regradeReport.recalculation_latency_ms}ms · round trip ${regradeReport.request_latency_ms}ms`
                              : 'live preview'}
                          </div>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-4 divide-x divide-line border-b border-line">
                          <div className="p-3.5">
                            <div className="text-[10px] font-semibold uppercase tracking-[0.12em] text-ink-400">Average delta</div>
                            <div className="mt-1 font-mono text-lg text-ink-900">
                              {regradeReport && weightsChanged ? `${regradeReport.diff_rows.length && regradeReport.new_avg_score - assessment.metrics.avg_rubric_score >= 0 ? '+' : ''}${round2(regradeReport.new_avg_score - assessment.metrics.avg_rubric_score).toFixed(2)}` : '0.00'}
                            </div>
                          </div>
                          <div className="p-3.5">
                            <div className="text-[10px] font-semibold uppercase tracking-[0.12em] text-ink-400">Gained marks</div>
                            <div className="mt-1 font-mono text-lg text-sage-700">{regradeReport && weightsChanged ? regradeReport.diff_rows.filter(r => r.score_delta > 0).length : 0}</div>
                          </div>
                          <div className="p-3.5">
                            <div className="text-[10px] font-semibold uppercase tracking-[0.12em] text-ink-400">Lost marks</div>
                            <div className="mt-1 font-mono text-lg text-wine-600">{regradeReport && weightsChanged ? regradeReport.diff_rows.filter(r => r.score_delta < 0).length : 0}</div>
                          </div>
                          <div className="p-3.5">
                            <div className="text-[10px] font-semibold uppercase tracking-[0.12em] text-ink-400">QWK shift</div>
                            <div className="mt-1 font-mono text-lg text-ink-900">
                              {regradeReport && weightsChanged && regradeReport.old_qwk && regradeReport.new_qwk
                                ? `${(regradeReport.new_qwk.qwk_score - regradeReport.old_qwk.qwk_score) >= 0 ? '+' : ''}${(regradeReport.new_qwk.qwk_score - regradeReport.old_qwk.qwk_score).toFixed(3)}`
                                : '—'}
                            </div>
                          </div>
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left">
                            <thead>
                              <tr className="text-[10px] uppercase tracking-[0.1em] text-ink-400 border-b border-line">
                                <th className="px-5 py-2.5 font-medium">Candidate</th>
                                <th className="px-3 py-2.5 font-medium">Baseline</th>
                                <th className="px-3 py-2.5 font-medium">New mark</th>
                                <th className="px-3 py-2.5 font-medium">Delta</th>
                                <th className="px-5 py-2.5 font-medium">Justification</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-line">
                              {diffRows.map(row => (
                                <tr key={row.student_id} className="hover:bg-paper-soft transition-colors">
                                  <td className="px-5 py-2.5 font-mono text-[11px] text-ink-900">{row.student_id}</td>
                                  <td className="px-3 py-2.5 font-mono text-[11px] text-ink-400">{row.old_score.toFixed(2)}</td>
                                  <td className="px-3 py-2.5 font-mono text-[11px] text-ink-900">{row.new_score.toFixed(2)}</td>
                                  <td className="px-3 py-2.5">
                                    <span className={`inline-flex rounded-full px-1.5 py-0.5 font-mono text-[10px] ${
                                      row.score_delta > 0 ? 'bg-sage-100 text-sage-700'
                                        : row.score_delta < 0 ? 'bg-wine-100 text-wine-600'
                                          : 'bg-paper-deep text-ink-400'
                                    }`}>
                                      {row.score_delta > 0 ? '+' : ''}{row.score_delta.toFixed(2)}
                                    </span>
                                  </td>
                                  <td className="px-5 py-2.5 text-[11px] leading-relaxed text-ink-500 max-w-[420px]">{row.explanation}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>

                        {regradeError && (
                          <div className="mx-5 mt-4 rounded-lg border border-wine-600/25 bg-wine-100 px-3 py-2 text-[11px] text-wine-700">{regradeError}</div>
                        )}

                        <p className="px-5 py-3.5 text-[10.5px] leading-relaxed text-ink-400 border-t border-line mt-3">
                          Marks update instantly from current weights. “Recalc” times the deterministic scoring pass; “round trip” includes the HTTP request. Summary cards and the roster always show the same weighted marks.
                        </p>
                      </div>
                    </div>
                  )}

                  {/* ---------- TAB: REVIEW ---------- */}
                  {activeTab === 'review' && (
                    <div className="mt-5 rounded-2xl border border-line bg-paper-card shadow-card">
                      <div className="px-5 py-4 border-b border-line flex flex-wrap items-start justify-between gap-3">
                        <div>
                          <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-ink-400">Human review</div>
                          <p className="mt-1 text-[11px] text-ink-500 max-w-xl">
                            Flagged when the AI–human gap is at least 1.5 marks or confidence falls below 55. Approvals are recorded for this session and included in the CSV export.
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="rounded-full border border-line bg-paper-soft px-2.5 py-1 font-mono text-[10px] text-ink-500">
                            {pendingReviews} pending
                          </span>
                          <span className="rounded-full border border-line bg-paper-soft px-2.5 py-1 font-mono text-[10px] text-ink-500">
                            {flaggedCount} flagged
                          </span>
                        </div>
                      </div>

                      {flaggedCount === 0 ? (
                        <div className="px-6 py-14 text-center">
                          <div className="mx-auto h-10 w-10 rounded-full bg-sage-100 border border-sage-600/25 flex items-center justify-center">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#276046" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                              <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                          </div>
                          <p className="mt-3 font-display text-lg text-ink-700">All clear</p>
                          <p className="mt-1 text-xs text-ink-400">Every mark is within 1.5 points of the human benchmark with high confidence.</p>
                        </div>
                      ) : (
                        <div className="divide-y divide-line">
                          {assessment.students.filter(needsReview).map(s => {
                            const conf = confidenceOf(s);
                            const approved = isReviewed(s);
                            const gap = discrepancyOf(s);
                            return (
                              <div key={s.student_id} className={`px-5 py-4 flex flex-col lg:flex-row lg:items-start justify-between gap-4 ${approved ? 'bg-sage-100/30' : ''}`}>
                                <div className="min-w-0">
                                  <div className="flex flex-wrap items-center gap-2">
                                    <span className="font-mono text-xs text-ink-900">{s.student_id}</span>
                                    <ConfidenceBadge confidence={conf} />
                                    {gap !== null && (
                                      <span className="rounded-full border border-line bg-paper-soft px-2 py-0.5 font-mono text-[10px] text-ink-500">
                                        AI–human gap {gap.toFixed(2)}
                                      </span>
                                    )}
                                    {approved && (
                                      <span className="rounded-full border border-sage-600/25 bg-sage-100 px-2 py-0.5 text-[10px] font-medium uppercase tracking-[0.1em] text-sage-700">
                                        Approved
                                      </span>
                                    )}
                                  </div>
                                  <p className="mt-1.5 text-[11px] leading-relaxed text-ink-500 line-clamp-2">
                                    {s.student_answer && s.student_answer.trim() ? s.student_answer : '(blank response)'}
                                  </p>
                                  <p className="mt-1.5 text-[10.5px] leading-relaxed text-ink-400">{conf.reasons.slice(0, 2).join(' · ')}</p>
                                </div>

                                <div className="flex items-center gap-5 shrink-0">
                                  <div className="text-right">
                                    <div className="text-[9.5px] font-medium uppercase tracking-[0.12em] text-ink-400">AI</div>
                                    <div className="font-mono text-sm text-ink-900">{scoreOf(s)}</div>
                                  </div>
                                  <div className="text-right">
                                    <div className="text-[9.5px] font-medium uppercase tracking-[0.12em] text-ink-400">Human</div>
                                    <div className="font-mono text-sm text-ink-500">{s.human_score === null || s.human_score === undefined ? 'N/A' : s.human_score}</div>
                                  </div>
                                  {approved ? (
                                    <button
                                      type="button"
                                      onClick={() => undoReview(s)}
                                      className="rounded-lg border border-sage-600/25 bg-sage-100 px-3 py-2 text-[11px] font-medium text-sage-700 transition hover:bg-sage-100/70"
                                    >
                                      Undo
                                    </button>
                                  ) : (
                                    <button
                                      type="button"
                                      onClick={() => approveReview(s)}
                                      className="rounded-lg bg-wine-600 px-3.5 py-2 text-[11px] font-medium text-paper transition hover:bg-wine-700"
                                    >
                                      Approve mark
                                    </button>
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  {/* ---------- TAB: EXPORT ---------- */}
                  {activeTab === 'export' && (
                    <div className="mt-5 grid grid-cols-1 lg:grid-cols-[1.15fr_1fr] gap-5 items-start">
                      <div className="rounded-2xl border border-line bg-paper-card p-6 shadow-card">
                        <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-ink-400">Batch export</div>
                        <h3 className="mt-2 font-display text-2xl text-ink-900">Graded results, ready for the gradebook</h3>
                        <p className="mt-2 text-[12px] leading-relaxed text-ink-500">
                          One CSV with effective marks for the current rubric weights, per-criterion decisions and quotes, confidence signals, review flags and teacher approvals.
                        </p>

                        <a
                          href={exportHref}
                          download={`rubricgrader_${activeDatasetId.replace(':', '_')}.csv`}
                          className="mt-5 inline-flex items-center gap-2 rounded-lg bg-wine-600 px-4 py-2.5 text-xs font-medium text-paper transition hover:bg-wine-700"
                        >
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                          </svg>
                          Download CSV
                        </a>

                        <div className="mt-6 grid grid-cols-2 gap-x-6 gap-y-3 border-t border-line pt-4 text-[11px]">
                          <div className="flex justify-between gap-3">
                            <span className="text-ink-400">Cohort</span>
                            <span className="font-mono text-ink-900">{assessment.metrics.total_submissions}</span>
                          </div>
                          <div className="flex justify-between gap-3">
                            <span className="text-ink-400">Total marks</span>
                            <span className="font-mono text-ink-900">{currentMax.toFixed(1)}</span>
                          </div>
                          <div className="flex justify-between gap-3">
                            <span className="text-ink-400">Approved</span>
                            <span className="font-mono text-ink-900">{reviewedIds.length}</span>
                          </div>
                          <div className="flex justify-between gap-3">
                            <span className="text-ink-400">Engine</span>
                            <span className="font-mono text-ink-900">{engineLabel}</span>
                          </div>
                        </div>
                        <p className="mt-4 text-[10.5px] leading-relaxed text-ink-400">
                          UTF-8 with BOM so Excel opens it cleanly. Weights and approvals are applied at download time.
                        </p>
                      </div>

                      <div className="rounded-2xl border border-line bg-paper-card p-6 shadow-card">
                        <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-ink-400">What’s inside</div>
                        <ul className="mt-3 space-y-2.5 text-[12px] text-ink-700">
                          {[
                            'Student ID, answer, baseline and effective marks',
                            'Semantic match percentage and match band',
                            'Each criterion’s decision, marks and evidence quote',
                            'Human mark, discrepancy and review flag',
                            'Confidence score with plain-English reasons',
                            'Teacher approval status and formative feedback'
                          ].map(item => (
                            <li key={item} className="flex gap-2.5">
                              <svg className="mt-0.5 shrink-0" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2F6B4F" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                <polyline points="20 6 9 17 4 12"></polyline>
                              </svg>
                              <span>{item}</span>
                            </li>
                          ))}
                        </ul>
                        <div className="mt-5 rounded-xl border border-line bg-paper-soft px-4 py-3">
                          <div className="text-[10px] font-semibold uppercase tracking-[0.12em] text-ink-400">Privacy</div>
                          <p className="mt-1 text-[11px] leading-relaxed text-ink-500">
                            Answers are embedded and graded on this machine. No student text leaves the device, and the dashboard keeps working from its offline evaluation cache.
                          </p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </>
            )}
          </main>

          <footer className="border-t border-line mt-4">
            <div className="mx-auto max-w-[1400px] px-4 sm:px-6 lg:px-8 py-5 flex flex-wrap items-center justify-between gap-2 text-[10px] uppercase tracking-[0.12em] text-ink-400">
              <span>RubricGrader AI · QUBRIX AIML Problem 2</span>
              <span>{assessment ? engineLabel : 'local engine'} · deterministic regrading · evidence-first</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
